<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Coffee</title>
    <style>
      :root { --bg: #EDF1EE; --ink: #2B1D16; --sub: #66675F; --line: #D3DBD6; --green: #1F3D36; --caramel: #C98A3B; --card: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #14211E; --ink: #F3EDE6; --sub: #A9B3AE; --line: #2E3F3A; --green: #DCE8E2; --card: #1B2B27; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Nunito", system-ui, sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 56px 16px; }
      h1 { color: var(--green); font-size: 34px; margin: 12px 0 6px; }
      p { color: var(--sub); margin: 0 0 28px; line-height: 1.5; }
      a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; color: inherit; text-decoration: none; }
      a.card:hover, a.card:focus-visible { border-color: var(--caramel); }
      a.card:focus-visible { outline: 3px solid var(--caramel); outline-offset: 2px; }
      .t { font-weight: 800; font-size: 18px; }
      .d { color: var(--sub); font-size: 14px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <g stroke="#C98A3B" stroke-width="3" stroke-linecap="round" fill="none"><path d="M22 17c-3-3 3-5 0-9"/><path d="M32 17c-3-3 3-5 0-9"/><path d="M42 17c-3-3 3-5 0-9"/></g>
        <path d="M12 24h40v12a16 16 0 0 1-16 16h-8a16 16 0 0 1-16-16z" fill="#F3E3CC"/>
        <path d="M52 28h4a6 6 0 0 1 0 12h-5" fill="none" stroke="#F3E3CC" stroke-width="4"/>
        <rect x="8" y="56" width="48" height="4" rx="2" fill="#C98A3B"/>
      </svg>
      <h1>Coffee</h1>
      <p>A corner of aaryaakamdar.com for things about coffee.</p>
      <a class="card" href="/sip/">
        <div class="t">Sip Log</div>
        <div class="d">A shared timer for how long each coffee lasts, kept by two friends in two time zones.</div>
      </a>
    </main>
  </body>
</html>
