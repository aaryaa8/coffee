<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Coffee</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 24h40v12a16 16 0 0 1-16 16h-8a16 16 0 0 1-16-16z' fill='%23B98D70'/%3E%3C/svg%3E" />
    <style>
      :root { --oat: #F5EFE4; --latte: #DCC6AB; --caramel: #B98D70; --espresso: #654735; --ink: #29241F; --dim: rgba(41, 36, 31, .68); --rule: rgba(41, 36, 31, .14); color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--oat); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 64px 16px; }
      h1 { font-size: 28px; font-weight: 600; margin: 16px 0 6px; }
      p { color: var(--dim); margin: 0 0 32px; line-height: 1.5; }
      a.row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; }
      a.row:hover .t, a.row:focus-visible .t { text-decoration: underline; text-decoration-color: var(--caramel); text-underline-offset: 4px; }
      a.row:focus-visible { outline: 2px solid var(--espresso); outline-offset: 4px; }
      .t { font-weight: 600; }
      .d { color: var(--dim); font-size: 14px; margin-top: 4px; }
      .go { color: var(--espresso); }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
        <g stroke="#B98D70" stroke-width="3" stroke-linecap="round" fill="none"><path d="M22 17c-3-3 3-5 0-9"/><path d="M32 17c-3-3 3-5 0-9"/><path d="M42 17c-3-3 3-5 0-9"/></g>
        <path d="M12 24h40v12a16 16 0 0 1-16 16h-8a16 16 0 0 1-16-16z" fill="#DCC6AB"/>
        <path d="M52 28h4a6 6 0 0 1 0 12h-5" fill="none" stroke="#DCC6AB" stroke-width="4"/>
        <rect x="8" y="56" width="48" height="4" rx="2" fill="#654735"/>
      </svg>
      <h1>Coffee</h1>
      <p>A corner of aaryaakamdar.com for things about coffee.</p>
      <a class="row" href="/sip/">
        <div>
          <div class="t">Sip Log</div>
          <div class="d">A shared timer for how long each coffee lasts, kept by two friends in two time zones.</div>
        </div>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </main>
  </body>
</html>
